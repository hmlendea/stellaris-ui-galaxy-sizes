name: Steam Workshop

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Update the mod version
      run: |
        MOD_VERSION="${VERSION#v}"

        for DESCRIPTOR in "ui-galaxy-sizes.mod" "ui-galaxy-sizes/descriptor.mod"
        do
          if grep -q '^version=' "${DESCRIPTOR}"; then
            sed -i "s/^version=.*/version=\"${MOD_VERSION}\"/" "${DESCRIPTOR}"
          else
            printf 'version="%s"\n' "${MOD_VERSION}" | cat - "${DESCRIPTOR}" > "${DESCRIPTOR}.tmp"
            mv "${DESCRIPTOR}.tmp" "${DESCRIPTOR}"
          fi
        done

    - name: Build the release archive
      run: |
        zip -r "release.zip" "ui-galaxy-sizes/" "ui-galaxy-sizes.mod"

    - name: Extract the release archive
      run: |
        unzip "release.zip" -d "release/"

    - name: Upload
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 281990
        itemid: 2047543230
        path: "release/ui-galaxy-sizes/"
        changenote: "[url=https://github.com/hmlendea/stellaris-ui-galaxy-sizes/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}